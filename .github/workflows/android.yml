name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        KEYSTORE_VALID=false
        STORE_TYPE="PKCS12"

        # Check if user provided KEYSTORE_BASE64 secret
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Decoding provided KEYSTORE_BASE64 secret..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > bitchord-release.jks 2>/dev/null || true

          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"

          # Validate against PKCS12 (standard for modern JDKs)
          if keytool -list -keystore bitchord-release.jks -storepass "$STORE_PASS" -storetype PKCS12 -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore successfully validated as PKCS12 format."
            STORE_TYPE="PKCS12"
            KEYSTORE_VALID=true
          # Validate against legacy JKS format
          elif keytool -list -keystore bitchord-release.jks -storepass "$STORE_PASS" -storetype JKS -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore successfully validated as JKS format."
            STORE_TYPE="JKS"
            KEYSTORE_VALID=true
          else
            echo "::warning::Provided KEYSTORE_BASE64 failed keytool verification with the provided credentials. Falling back to generated CI keystore."
          fi
        fi

        if [ "$KEYSTORE_VALID" = "true" ]; then
          echo "Using verified user release keystore."
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "storeType=$STORE_TYPE"
          } > keystore.properties
        else
          echo "Generating a dedicated release signing keystore..."
          keytool -genkeypair -v -keystore bitchord-release.jks -alias bitchord -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bitchord123 -keypass bitchord123 -storetype PKCS12 \
            -dname "CN=BitChordRelease, OU=BitChord, O=BitChord, L=City, S=State, C=US"
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=bitchord123"
            echo "keyAlias=bitchord"
            echo "keyPassword=bitchord123"
            echo "storeType=PKCS12"
          } > keystore.properties
        fi

    - name: Validate Keystore
      run: |
        PROP_STORE_TYPE=$(grep "^storeType=" keystore.properties | cut -d'=' -f2)
        PROP_STORE_PASS=$(grep "^storePassword=" keystore.properties | cut -d'=' -f2)
        PROP_KEY_ALIAS=$(grep "^keyAlias=" keystore.properties | cut -d'=' -f2)
        echo "Validating keystore (storeType: $PROP_STORE_TYPE, alias: $PROP_KEY_ALIAS)..."
        keytool -list -keystore bitchord-release.jks -storepass "$PROP_STORE_PASS" -storetype "$PROP_STORE_TYPE" -alias "$PROP_KEY_ALIAS"
        echo "Keystore verified successfully."

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
